blueprint:
  name: Motion Light
  description: >-
    Switch lights on when motion is detected and off again once every motion
    sensor has been clear for a while.


    Only the lights this automation switched on are switched off again. A light
    that was already on when motion started is left alone.


    Turning on can be gated on ambient light, on a time window, and on a bypass
    entity. Turning off is only blocked by the bypass, so lights can never be
    stranded on by a lux reading or by the end of the time window.


    Switching off happens in the same run as switching on. If Home Assistant
    restarts while the room is still occupied, the pending switch off is lost
    and the lights stay on until the next motion.
  domain: automation
  author: Josa Gesell
  source_url: https://github.com/josa42/homeassistant-automations/blob/main/blueprints/automation/motion-light.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    devices:
      name: Devices
      icon: mdi:motion-sensor
      input:
        motion_sensors:
          name: Motion sensors
          description: >-
            Motion or occupancy sensors that report the room. An area, floor or
            label works too, and then follows its members over time.
          selector:
            target:
              entity:
                - domain: binary_sensor
                  device_class: motion
                - domain: binary_sensor
                  device_class: occupancy
        lights:
          name: Lights
          description: >-
            The lights to switch on. Only those that were off when motion
            started are switched off again once the room clears.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
    behaviour:
      name: Behaviour
      icon: mdi:cog
      input:
        no_motion_wait:
          name: Wait time
          description: >-
            How long every motion sensor has to stay clear before the lights are
            switched off.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration: {}
        brightness_pct:
          name: Brightness
          description: >-
            Brightness the lights are switched on with. Applied only to the
            lights that were off, so dimming one by hand keeps until the room
            has been empty once.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    conditions:
      name: Conditions
      icon: mdi:filter
      collapsed: true
      input:
        lux_sensors:
          name: Luminance sensors
          description: >-
            Optional. The lights are only switched on while every selected
            sensor reads below the threshold. Leave empty to ignore ambient
            light.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: illuminance
        lux_threshold:
          name: Luminance threshold
          description: The lights stay off while it is brighter than this.
          default: 50
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              unit_of_measurement: lx
              mode: slider
        use_time_window:
          name: Restrict to a time window
          description: >-
            Only switch lights on between the two times below. Switching off is
            never restricted.
          default: false
          selector:
            boolean: {}
        time_after:
          name: Not before
          default: "00:00:00"
          selector:
            time: {}
        time_before:
          name: Not after
          default: "00:00:00"
          selector:
            time: {}
        bypass_entities:
          name: Bypass
          description: >-
            Optional. While any of these entities is on, the automation does
            nothing at all: lights are neither switched on nor off.
          default: []
          selector:
            entity:
              multiple: true

mode: single
max_exceeded: silent

variables:
  lights: !input lights
  lux_sensors: !input lux_sensors
  lux_threshold: !input lux_threshold
  bypass_entities: !input bypass_entities
  brightness_pct: !input brightness_pct

triggers:
  - trigger: motion.detected
    target: !input motion_sensors
    options:
      behavior: first
  - trigger: occupancy.detected
    target: !input motion_sensors
    options:
      behavior: first

conditions:
  - alias: Not bypassed
    condition: template
    value_template: &not_bypassed >-
      {{ expand(bypass_entities) | selectattr('state', 'eq', 'on') | list | count == 0 }}
  - alias: Dark enough
    condition: template
    value_template: >-
      {% set readings = expand(lux_sensors) | map(attribute='state')
         | map('float', -1) | select('ge', 0) | list %}
      {{ readings | count == 0 or readings | max < lux_threshold | float }}
  - alias: Within the time window
    condition: time
    after: !input time_after
    before: !input time_before
    enabled: !input use_time_window

actions:
  - alias: Take over the lights that are off
    variables:
      owned_lights: >-
        {{ expand(lights) | selectattr('state', 'eq', 'off')
           | map(attribute='entity_id') | list }}
  - alias: Stop unless a light was off
    condition: template
    value_template: "{{ owned_lights | count > 0 }}"
  - alias: Switch those lights on
    action: light.turn_on
    target:
      entity_id: "{{ owned_lights }}"
    data:
      brightness_pct: "{{ brightness_pct }}"
  - alias: Wait until every sensor has been clear
    repeat:
      while:
        - not:
            - and:
                - condition: motion.is_not_detected
                  target: !input motion_sensors
                  options:
                    behavior: all
                    for: !input no_motion_wait
                - condition: occupancy.is_not_detected
                  target: !input motion_sensors
                  options:
                    behavior: all
                    for: !input no_motion_wait
      sequence:
        - wait_for_trigger:
            - trigger: motion.cleared
              target: !input motion_sensors
              options:
                behavior: all
                for: !input no_motion_wait
            - trigger: occupancy.cleared
              target: !input motion_sensors
              options:
                behavior: all
                for: !input no_motion_wait
  - alias: Not bypassed
    condition: template
    value_template: *not_bypassed
  - alias: Switch off only what was taken over
    action: light.turn_off
    target:
      entity_id: "{{ owned_lights }}"
